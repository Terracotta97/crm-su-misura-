# Installazione indipendente di UNICA CRM per presentazione.
# NON collegare risorse del precedente account aziendale.
name = "crm-demo-personale"
main = "./index.tsx"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/"]

[vars]
ENVIRONMENT = "demo"

[[d1_databases]]
binding = "DB"
database_name = "crm-demo-personale-db"
database_id = "084d5e57-f0ec-4d34-b4a4-cec22840aefd"

[[r2_buckets]]
binding = "R2"
bucket_name = "crm-demo-personale-rilievi"
