name: Verifica build CRM Cloudflare
on:
  push:
    branches:
      - cloudflare-crm-completo
      - fix-d1-login-500
      - main
  workflow_dispatch:
jobs:
  valida:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Recupera il codice
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Installa le dipendenze
        run: npm ci
      - name: Prepara frontend originale
        run: npm run build
      - name: Verifica asset
        run: test -f public/static/app.js && test -f public/static/style.css
      - name: Compila Cloudflare Worker senza pubblicare
        run: npx wrangler deploy --dry-run --outdir .wrangler-check
      - name: Verifica CRM originale (senza password esterna) su D1 locale
        shell: bash
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > /tmp/unica-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /tmp/unica-home.html http://127.0.0.1:8787/; then break; fi
            sleep 2
          done
          if ! grep -q 'UNICA' /tmp/unica-home.html; then
            echo "Homepage originale non disponibile"
            tail -n 50 /tmp/unica-worker.log
            exit 1
          fi
          HTTP_CODE=$(curl -sS -o /tmp/unica-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"admin123"}' \
            http://127.0.0.1:8787/api/auth/login)
          echo "HTTP login code: $HTTP_CODE"
          if [[ "$HTTP_CODE" != "200" ]] || ! grep -q '"success":true' /tmp/unica-login.json; then
            echo "Il login CRM originale non funziona"
            cat /tmp/unica-login.json
            sleep 2
            tail -n 100 /tmp/unica-worker.log
            exit 1
          fi
