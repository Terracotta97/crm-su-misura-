/* Identità aziendale Global Technology */
:root{color:#1b2430;background:#f5f7fb}
.side{background:#063782;color:#d7e4f8}
.brand{display:block;padding:9px 9px 17px;border-bottom:1px solid #3762a1}
.brand-logo{background:white;border-radius:11px;padding:10px 7px;display:flex;align-items:center;justify-content:center;min-height:82px}
.brand-logo img{display:block;max-width:100%;width:205px;height:auto}
.brand-label{margin-top:12px;text-align:center}
.brand-label strong{display:block;color:white;font-size:13px;letter-spacing:.035em}
.brand-label small{margin-top:5px;color:#cbdafa;font-size:9px;letter-spacing:.12em}
.side small.heading{color:#b9cef2}
.nav button{color:#d8e6ff}
.nav button:hover,.nav button.active{background:#1b56a0;color:white}
.side-bottom{border-color:#3762a1;color:#c2d4f2}
.btn.primary{background:#0b4da2;border-color:#0b4da2}
.btn.primary:hover{background:#07377a}
.btn:focus-visible,.filter:focus-visible,.link:focus-visible{outline:3px solid #8db5fb;outline-offset:2px}
.pill{background:#eaf1ff;color:#144e9e}
.pill.done{background:#eff3f9;color:#58718f}
.progress>div,.bar>span{background:#1a62bb}
.cal-day.selected{background:#e9f1ff;border-color:#0b4da2}
.cal-day:hover{background:#f2f6fe;border-color:#1a62bb}
.cal-day .dot{background:#0b4da2}
.day-icon{background:#eaf1ff;color:#0b4da2}
.avatar{background:#eaf1ff;color:#0b4da2}
.link{color:#0b4da2}
.demo-tag{background:#f0f5ff;border-color:#bdd0f6;color:#164a91}
.dialog{display:flex;flex-direction:column;max-height:min(92vh,950px)}
.dialog form{display:flex;flex-direction:column;overflow:hidden;min-height:0}
.dialog-b{overflow:auto;flex:1}
.dialog-f{flex-shrink:0;background:white;box-shadow:0 -8px 15px rgba(15,42,84,.035)}
.date-label{font-size:11px;font-weight:700;color:#6c83a0}
.cantieri-row{display:grid;grid-template-columns:minmax(170px,2.1fr) 105px minmax(96px,.8fr) 100px 120px minmax(100px,1fr) auto;gap:16px;align-items:center;border-bottom:1px solid #e7eef7;padding:14px 8px}
.cantieri-row:last-child{border-bottom:0}
.cantieri-row.cantieri-header{background:#f5f8fd;color:#74869b;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.065em;padding-top:12px;padding-bottom:12px}
.cantieri-name{font-weight:750;font-size:13px;display:block;margin-bottom:3px}
.cantieri-compact-progress{min-width:90px}
.cantieri-actions{display:flex;gap:6px;justify-content:flex-end}
.cantieri-mobile-label{display:none}
.toast{position:fixed;bottom:22px;right:22px;background:#0a326a;color:white;border-radius:12px;padding:13px 18px;box-shadow:0 8px 30px rgba(0,20,65,.18);font-size:13px;font-weight:720;z-index:100}
@media(max-width:1180px){.cantieri-row{grid-template-columns:minmax(170px,2fr) 95px minmax(85px,1fr) 85px auto}.cantieri-row .cantieri-contract,.cantieri-row .cantieri-progress{display:none}}
@media(max-width:760px){
.brand{display:flex;gap:12px;align-items:center}
.brand-logo{min-height:0;padding:5px;flex:0 0 124px}
.brand-logo img{width:118px}
.brand-label{margin-top:0;text-align:left}
.brand-label strong{font-size:11px}
.cantieri-row{grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:15px 3px}
.cantieri-row.cantieri-header{display:none}
.cantieri-row .cantieri-city,.cantieri-row .cantieri-status,.cantieri-row .cantieri-contract,.cantieri-row .cantieri-progress{display:none}
.cantieri-mobile-label{display:block}
.cantieri-actions{grid-column:2;grid-row:1 / span 2;align-self:center}
.cantieri-date{font-size:11px}
.toast{bottom:12px;right:12px;left:12px}
}


/* Gestionale: nuove aree Leasing, Pagamenti e Bolle */
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.pay-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.payment-row{display:grid;grid-template-columns:minmax(160px,1.5fr) 105px 115px 115px auto;gap:13px;align-items:center;padding:14px 9px;border-bottom:1px solid #eaf0f6}
.payment-row.header{background:#f5f8fd;color:#73899e;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;padding-block:12px}
.payment-row:last-child{border-bottom:0}
.lease-row{display:grid;grid-template-columns:minmax(150px,1.35fr) minmax(120px,1fr) 95px 110px 110px auto;gap:13px;align-items:center;padding:14px 8px;border-bottom:1px solid #eaf0f6}
.lease-row.header{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#73899e;background:#f5f8fd}
.lease-row:last-child{border-bottom:0}
.ddt-row{display:grid;grid-template-columns:minmax(125px,1fr) 115px minmax(150px,1.5fr) 100px auto;gap:14px;align-items:center;padding:14px 8px;border-bottom:1px solid #eaf0f6}
.ddt-row.header{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:#73899e;background:#f5f8fd}
.ddt-row:last-child{border-bottom:0}
.ddt-item-fields{border:1px solid #e4eaf3;border-radius:11px;padding:12px;margin-bottom:9px}
.ddt-item-fields .row{gap:9px}
.ddt-item-fields .formgroup{flex:1;margin:0}
.ddt-item-fields .qty{max-width:95px}
.ddt-item-fields .unit{max-width:95px}
.ddt-paper{padding:31px 30px;color:#182d45;background:white}
.ddt-paper h2{font-size:22px;margin:12px 0}
.ddt-doc-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:17px;border-bottom:2px solid #1b4b96}
.ddt-doc-header img{max-width:220px;max-height:100px;object-fit:contain}
.ddt-doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
.ddt-doc-meta>div{border:1px solid #dfe7f4;padding:13px;border-radius:7px}
.ddt-doc-label{font-size:10px;text-transform:uppercase;color:#73899e;letter-spacing:.08em;font-weight:750;margin-bottom:5px}
.ddt-disclaimer{color:#96501b;background:#fff4e3;padding:10px;border-radius:8px;font-weight:750;font-size:11px;margin-top:18px}
@media(max-width:1100px){.payment-row{grid-template-columns:minmax(145px,1.5fr) 95px 95px auto}.payment-row .payment-amount-total{display:none}.lease-row{grid-template-columns:minmax(140px,1fr) 90px 95px auto}.lease-row .lease-vendor,.lease-row .lease-site{display:none}}
@media(max-width:760px){
.pay-summary{grid-template-columns:1fr}
.payment-row{grid-template-columns:minmax(0,1fr) auto;gap:5px}
.payment-row.header{display:none}
.payment-row .payment-earned,.payment-row .payment-paid,.payment-row .payment-amount-total{display:none}
.lease-row{grid-template-columns:minmax(0,1fr) auto;gap:5px}
.lease-row.header,.lease-row .lease-vendor,.lease-row .lease-site,.lease-row .lease-amount{display:none}
.ddt-row{grid-template-columns:minmax(0,1fr) auto;gap:6px}
.ddt-row.header,.ddt-row .ddt-date,.ddt-row .ddt-site{display:none}
.ddt-doc-meta{grid-template-columns:1fr}
.ddt-item-fields .row{flex-wrap:wrap}
.ddt-item-fields .qty,.ddt-item-fields .unit{max-width:none;min-width:42%}
}
@media print{
.app{display:none!important}
#modal-root{display:block!important}
#ddt-preview-modal{position:static!important;display:block!important;padding:0!important;background:#fff!important}
#ddt-preview-dialog{width:100%!important;max-height:none!important;overflow:visible!important;box-shadow:none!important;border:0!important}
#ddt-preview-dialog .dialog-h,#ddt-preview-dialog .dialog-f{display:none!important}
#ddt-preview-body{padding:0!important;overflow:visible!important}
.ddt-paper{padding:0!important}
}

function eur(n){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);}

function paid(site){return sum(state.entries.filter(function(e){return e.siteId===site&&e.type==='pagamento';}).map(function(e){return e.amount;}));}

var file=form.querySelector('#f_attachment').files[0];if(file){try{await saveAttachment(x.id,file);x.fileName=file.name;}catch(err){alert('Il browser non è riuscito ad archiviare il documento. La registrazione verrà salvata senza allegato.');}}
if(e)Object.assign(e,x);else state.entries.push(x);save();siteId=x.siteId;activeDate=x.date;month=x.date.slice(0,7);closeModal();go(x.type==='fattura'?'documenti':'giornata');notify('✓ '+(e?'Registrazione aggiornata':'Registrazione salvata nel cantiere'));});
}
function updateForm(){var form=document.getElementById('modalForm');if(!form)return;var kind=form.elements.type.value;var per=['presenza','pagamento'].includes(kind);var meas=!['nota','fattura','pagamento'].includes(kind);var d=(id,show)=>{var el=document.getElementById(id);el.classList.toggle('hidden',!show);el.querySelectorAll('input,select,textarea').forEach(function(control){control.disabled=!show;});};
d('entry-person',per);d('entry-attendance',kind==='presenza');d('entry-measure',meas);d('entry-payamount',kind==='pagamento');d('entry-linked',kind==='fattura');d('entry-supplier',['materiale','spesa','noleggio','lavorazione'].includes(kind));d('entry-doc',['materiale','noleggio','spesa','lavorazione','fattura'].includes(kind));
if(kind==='fattura')form.elements.description.placeholder='Esempio: fattura DDT 145';
}
var origModal=modal;
modal=function(title,body,submit,text){origModal(title,body,submit,text);var form=document.getElementById('modalForm');if(form&&form.elements.type&&form.elements.personId){form.elements.type.onchange=updateForm;form.elements.personId.onchange=function(){var p=getPerson(this.value);if(p&&form.elements.mode){form.elements.mode.value=p.mode;form.elements.rate.value=p.rate;form.elements.unit.value=({ora:'ore',giornata:'giornata',misura:'m²',corpo:'a corpo'})[p.mode]||'ore';form.elements.qty.value=1;form.elements.amount.value=p.rate;}};form.elements.qty.oninput=form.elements.rate.oninput=function(){var amount=form.elements.qty.value*form.elements.rate.value;if(form.elements.amount)form.elements.amount.value=Number(amount.toFixed(2));};updateForm();}};
function shiftMonth(n){var p=month.split('-');var d=new Date(+p[0],+p[1]-1+n,1);month=localDate(d).slice(0,7);render();}
function shiftDate(n){var p=activeDate.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);activeDate=localDate(d);month=activeDate.slice(0,7);render();}
function confirmPresence(id){var e=state.entries.find(function(x){return x.id===id;});if(e){e.attendance='effettiva';save();render();}}
function deleteEntry(id){if(!confirm('Eliminare questa registrazione dalla demo?'))return;state.entries=state.entries.filter(function(e){return e.id!==id;});save();render();}
function reset(){if(!confirm('Ripristinare tutti i dati fittizi di partenza? Le tue modifiche in questo browser saranno cancellate.'))return;state=mkSeed();save();siteId='c1';activeDate=localDate(new Date());month=activeDate.slice(0,7);selectedPerson=null;go('dashboard');}
function openDB(){return new Promise(function(resolve,reject){if(!window.indexedDB){reject(new Error('IndexedDB non disponibile'));return;}var req=indexedDB.open('edilia-demo-attachments',1);req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files');};req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error);};});}
async function saveAttachment(id,file){var db=await openDB();return new Promise(function(resolve,reject){var t=db.transaction('files','readwrite');t.objectStore('files').put(file,id);t.oncomplete=function(){db.close();resolve();};t.onerror=function(){db.close();reject(t.error);};});}
async function downloadAttachment(id){var e=state.entries.find(function(x){return x.id===id;});if(!e||!e.fileName)return;try{var db=await openDB();var blob=await new Promise(function(resolve,reject){var t=db.transaction('files','readonly');var req=t.objectStore('files').get(id);req.onsuccess=function(){resolve(req.result);};req.onerror=function(){reject(req.error);};});db.close();if(!blob){alert('Allegato non disponibile in questo browser.');return;}var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=e.fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},3000);}catch(err){alert('Non è possibile leggere il documento da questo browser.');}}
document.addEventListener('click',function(ev){
var b=ev.target.closest('[data-nav],[data-action],[data-open-site],[data-site-filter],[data-edit-site],[data-month],[data-day],[data-select-date],[data-ledger],[data-pay-person],[data-confirm-entry],[data-delete-entry],[data-edit-entry],[data-download],[data-payment-filter],[data-lease-filter],[data-lease-details],[data-edit-lease],[data-pay-lease],[data-view-ddt],[data-edit-ddt]');if(!b)return;
if(b.dataset.nav){go(b.dataset.nav);return;}
if(b.dataset.paymentFilter){paymentFilter=b.dataset.paymentFilter;render();return;}
if(b.dataset.leaseFilter){leaseFilter=b.dataset.leaseFilter;render();return;}
if(b.dataset.leaseDetails){leaseDetails(b.dataset.leaseDetails);return;}
if(b.dataset.editLease){addLease(b.dataset.editLease);return;}
if(b.dataset.payLease){leasePaymentModal(b.dataset.payLease);return;}
if(b.dataset.viewDdt){ddtPreview(b.dataset.viewDdt);return;}
if(b.dataset.editDdt){ddtEditor(b.dataset.editDdt);return;}
if(b.dataset.openSite){openSite(b.dataset.openSite);return;}
if(b.dataset.siteFilter){siteFilter=b.dataset.siteFilter;render();return;}
if(b.dataset.editSite){addSite(b.dataset.editSite);return;}
if(b.dataset.month){shiftMonth(Number(b.dataset.month));return;}
if(b.dataset.day){shiftDate(Number(b.dataset.day));return;}
if(b.dataset.selectDate){activeDate=b.dataset.selectDate;render();return;}
if(b.dataset.ledger){selectedPerson=b.dataset.ledger;go('artigiani');return;}
if(b.dataset.payPerson){addEntry('pagamento',null,b.dataset.payPerson);return;}
if(b.dataset.confirmEntry){confirmPresence(b.dataset.confirmEntry);return;}
if(b.dataset.deleteEntry){deleteEntry(b.dataset.deleteEntry);return;}
if(b.dataset.editEntry){addEntry(null,b.dataset.editEntry);return;}
if(b.dataset.download){downloadAttachment(b.dataset.download);return;}
var a=b.dataset.action;
if(a==='add-site')addSite();else if(a==='add-lease')addLease();else if(a==='add-ddt')ddtEditor();else if(a==='new-artisan-payment')addEntry('pagamento');else if(a==='add-person')addPerson();else if(a==='add-entry')addEntry('presenza');else if(a==='add-document')addEntry('fattura');else if(a==='today'){activeDate=localDate(new Date());month=activeDate.slice(0,7);render();}else if(a==='reset')reset();else if(a==='close-ledger'){selectedPerson=null;render();}
});
document.addEventListener('change',function(e){if(e.target.id==='sitePicker'){siteId=e.target.value;render();}else if(e.target.id==='dayPicker'&&e.target.value){activeDate=e.target.value;month=activeDate.slice(0,7);render();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
render();
})();
</script>
